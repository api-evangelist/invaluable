aid: invaluable
name: Invaluable
description: >-
  Invaluable is the world's leading online marketplace for fine art, antiques and collectibles,
  founded in 1986. The platform aggregates live and timed auctions from more than 5,000 premier
  auction houses across 53 countries, giving collectors worldwide a single place to discover, bid on,
  and win items — with over 260,000 items listed at any time and an archive of 66+ million price
  records. Invaluable also operates AuctionZip and a Private Label / Connect white-label offering, and
  provides a partner-only Catalog Upload API that lets auction-management software companies add, edit,
  and delete lots in timed and live sales directly from their own systems. The company is backed by
  Insight Partners.
